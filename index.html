{% extends "base.html" %}

{% block title %}
My Collection
{% endblock %}

{% block content %}

<div class="row row-cols-2 row-cols-md-4 row-cols-lg-6 g-4">

{% for album in albums %}

<div class="col">

  <a href="{{ album.url }}"
     class="text-decoration-none text-dark">

    <div class="card h-100 shadow-sm">

      <img
        src="{{ album.cover_url }}"
        class="card-img-top"
        loading="lazy">

      <div class="card-body">

        <h6 class="card-title">
          {{ album.title }}
        </h6>

        <small class="text-muted">
          {{ album.artist }}
        </small>

      </div>

    </div>

  </a>

</div>

{% endfor %}

</div>

{% endblock %}
